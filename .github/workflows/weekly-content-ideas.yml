name: Weekly Content Ideas Fetch

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

jobs:
  fetch-content-ideas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch content ideas and append to Google Sheet
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "content-idea-fetcher/1.0"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CONTROL_HUB_SHEET_ID: ${{ secrets.CONTROL_HUB_SHEET_ID }}
        run: python scripts/fetch_content_ideas.py
